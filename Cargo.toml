[package]
name = "fraudnet"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
tiny_http = "0.12"
tokio-postgres = { version = "0.7", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
postgres = { version = "0.19", optional = true }
dotenv = "0.15"

[features]
default = []
database = ["tokio-postgres", "tokio", "postgres"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fraudnet"
path = "src/main.rs"

[[bin]]
name = "test-web"
path = "src/bin/test_web.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
