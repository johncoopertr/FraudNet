[package]
name = "fraudnet"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
tiny_http = "0.12"
tiberius = { version = "0.12", optional = true, default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["full"], optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }
dotenv = "0.15"
arrow = "53.3.0"
parquet = "53.3.0"

[features]
default = []
database = ["tiberius", "tokio", "tokio-util"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fraudnet"
path = "src/main.rs"

[[bin]]
name = "mnist"
path = "src/bin/mnist.rs"

[[bin]]
name = "test-web"
path = "src/bin/test_web.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
